<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Stargazers log</h1>
    <p>A log of the repositories I've starred.</p>
    <div id="starred-error" aria-live="off" role="status"></div>
    <ul id="starred" aria-label="Starred repositories"></ul>
    <noscript>
      <p class="noscript-message">JavaScript is required to display the starred repositories list.</p>
    </noscript>
    <script src="script.js"></script>
  </body>
</html>
